name: Auto Assign

# Assigns the author to a pull request when it is opened. Only the opening
# event assigns, so that a manual change of assignees is never overwritten.
on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  auto-assign:
    # Authors without write access (forks, bots) cannot be assigned, and their
    # pull requests only get a read-only token, so they are skipped.
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Add assignees to the pull request
      pull-requests: write
    steps:
      - name: Assign the pull request author
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --add-assignee "$PR_AUTHOR"
